name: checks

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in install.sh lib/*.sh lang/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S info install.sh lib/*.sh lang/*.sh
      - name: Every message exists in every language
        run: |
          export LC_ALL=C
          used=$(grep -rhoE '\$\(t [a-z0-9_]+' lib install.sh | awk '{print $2}' | sort -u)
          for lang in lang/*.sh; do
            have=$(grep -oE '^\s+\[[a-z0-9_]+\]' "$lang" | tr -d ' []' | sort -u)
            missing=$(comm -23 <(echo "$used") <(echo "$have"))
            [ -z "$missing" ] || { echo "$lang is missing: $missing"; exit 1; }
          done
